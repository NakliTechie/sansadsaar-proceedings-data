name: Debates walk and publish

# Every-6h walk of LS debate-search (LS-14..18) PLUS RS daily-proceedings
# session/date enumeration.
#
# Split off from the 2-hourly extract+derive workflow so that workflow can
# devote its entire 900s budget to body extraction. Walks are bounded by
# walk-early-stop (most buckets terminate after page 1) — total cost is
# ~5-10 min per run. At 4×/day, this stays well within the politeness
# budget and discovers any new records within 6 hours.
#
# Fires at :41 every 6 hours (00:41, 06:41, 12:41, 18:41 UTC) — offset
# from extract (:23 every 2h), questions walk (:17 every 6h), and the
# parliamentwatch corpora (LC :01 / FC :01) to avoid runner contention.

on:
  schedule:
    # Daily run, then a fallback ~12 h later that skips if today's run succeeded (set 21 Nov 2026).
    - cron: '46 21 * * *'
    - cron: '46 9 * * *'
  workflow_dispatch:
    inputs:
      lok_sabhas:
        description: 'LS terms to walk (CSV, default = LS-14..18 to match DRSC depth)'
        default: '14,15,16,17,18'
      rs_sessions:
        description: 'RS sessions to walk (CSV, "all" for full backfill, default = 2 most recent)'
        default: ''
      max_run_seconds:
        description: 'Hard wall-clock cap (seconds)'
        default: '1500'

permissions:
  contents: write

concurrency:
  # Share the debates concurrency group with debates.yml — a walk and
  # an extract must not race on the same checkout.
  group: debates
  cancel-in-progress: false

jobs:
  gate:
    # Daily schedule plus a fallback cron about 12 h later (both in `on.schedule`).
    # The fallback run skips the real job when this workflow already succeeded
    # today (IST), so a missed or failed morning run is retried once, and the
    # workflow-level concurrency group keeps the two from overlapping.
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IS_FALLBACK: ${{ github.event_name == 'schedule' && github.event.schedule == '46 9 * * *' }}
        run: |
          if [ "$IS_FALLBACK" != "true" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          start=$(date -u -d "$(TZ=Asia/Kolkata date +%F) 00:00 +0530" +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh run list --workflow debates-walk.yml --status success --created ">=$start" --limit 20 \
                --json databaseId --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID)] | length")
          echo "successful runs of debates-walk.yml since $start (IST midnight): $n"
          if [ "$n" -gt 0 ]; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi

  walk:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Configure git identity for in-flight checkpoint commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Walk + merge primary records
        env:
          BUILD_PHASE:    'walk'
          LOK_SABHAS:     ${{ inputs.lok_sabhas   || '14,15,16,17,18' }}
          # TEMP backfill mode: default 'all' walks every RS session each
          # walk run to clear the RS backlog. Revert to '' for steady-state
          # (recent-2 only) once docs/debates/audit.json reports rs_records
          # plateaued.
          RS_SESSIONS:    ${{ inputs.rs_sessions  || 'all' }}
          MAX_RUN_SECONDS: ${{ inputs.max_run_seconds || '1500' }}
          JITTER_MIN_MS:  '250'
          JITTER_MAX_MS:  '500'
        run: python build_debates.py

      - name: Commit and push walked records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/debates/
          git diff --cached --quiet && echo "no walk changes" && exit 0
          git commit -m "Auto-walk debates primary data [$(date -u +%Y-%m-%dT%H:%MZ)]"
          for attempt in 1 2 3 4 5; do
            if git fetch origin main && git rebase -X theirs origin/main && git push origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt failed; retrying"
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "exceeded 5 push attempts; giving up — next walk run will catch up"
          exit 1
