name: Debates OCR slow-lane (RS)

# Weekly OCR slow lane for the RS half of the debates corpus. LS is
# HTML-from-API and never has scanned-PDF content, so OCR applies to RS
# only. Target set is RS PDFs marked .pypdf-empty by the main
# debates.yml workflow (scanned/encrypted PDFs that pypdf couldn't read).
#
# Cadence: Sunday 04:23 UTC (= 09:53 IST Sunday morning). OCR is
# expensive (~3-8 min/PDF); we process a small batch each week and
# slowly close the gap. Most modern RS PDFs are typeset and pypdf-
# friendly; the slow lane handles older sessions' residue.
#
# Off-cluster from cag-ocr (Sunday 02:17 UTC) and lc-ocr (Sunday
# 03:23 UTC).

on:
  schedule:
    - cron: '23 4 * * 0'
  workflow_dispatch:
    inputs:
      max_ocr_per_run:
        description: 'Max scanned PDFs to OCR this run (default 5)'
        default: '5'
      max_run_seconds:
        description: 'Hard wall-clock cap (seconds, default 2700 = 45m)'
        default: '2700'
      max_pages_per_pdf:
        description: 'Cap pages per PDF (default 400)'
        default: '400'
      render_dpi:
        description: 'pdf2image render DPI (default 150)'
        default: '150'

permissions:
  contents: write

concurrency:
  # Same group as debates.yml so daily writers and OCR serialise on
  # docs/debates/text/ writes.
  group: debates
  cancel-in-progress: false

jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install OCR system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-hin poppler-utils

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Configure git identity for in-flight checkpoint commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: OCR scanned RS PDFs
        env:
          MAX_OCR_PER_RUN:    ${{ inputs.max_ocr_per_run    || '5' }}
          MAX_RUN_SECONDS:    ${{ inputs.max_run_seconds    || '2700' }}
          MAX_PAGES_PER_PDF:  ${{ inputs.max_pages_per_pdf  || '400' }}
          RENDER_DPI:         ${{ inputs.render_dpi         || '150' }}
          TESSERACT_LANGS:    'eng+hin'
        run: python build_debates_ocr.py

      - name: Commit and push primary changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/debates/text/rs/
          git diff --cached --quiet && echo "no primary changes" && exit 0
          git commit -m "Auto-update debates RS OCR data [$(date -u +%Y-%m-%dT%H:%MZ)]"
          git pull --rebase origin main
          git push
